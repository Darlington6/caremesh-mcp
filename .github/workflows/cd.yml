name: Deploy to Amazon ECS

on:
  workflow_dispatch:
  # Uncomment to auto-deploy on every merge to main:
  # push:
  #   branches: [main]

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: caremesh-mcp
  ECS_SERVICE_ARN: arn:aws:ecs:eu-north-1:576329196251:service/default/caremesh-mcp
  BEDROCK_MODEL_ID: eu.anthropic.claude-haiku-4-5-20251001-v1:0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$image" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$image"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Look up auth token secret ARN
        id: secret
        run: |
          arn=$(aws secretsmanager describe-secret --secret-id caremesh-mcp/auth-token --region "$AWS_REGION" --query "ARN" --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Deploy new image to ECS Express Mode
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          SECRET_ARN: ${{ steps.secret.outputs.arn }}
        run: |
          aws ecs update-express-gateway-service \
            --region "$AWS_REGION" \
            --service-arn "$ECS_SERVICE_ARN" \
            --primary-container "{
              \"image\": \"$IMAGE\",
              \"containerPort\": 3000,
              \"awsLogsConfiguration\": { \"logGroup\": \"/ecs/caremesh-mcp\", \"logStreamPrefix\": \"ecs\" },
              \"environment\": [
                { \"name\": \"AWS_REGION\", \"value\": \"$AWS_REGION\" },
                { \"name\": \"BEDROCK_MODEL_ID\", \"value\": \"$BEDROCK_MODEL_ID\" }
              ],
              \"secrets\": [
                { \"name\": \"MCP_AUTH_TOKEN\", \"valueFrom\": \"$SECRET_ARN\" }
              ]
            }"

      - name: Wait for deployment to finish
        run: |
          deployment_arn=$(aws ecs describe-express-gateway-service --service-arn "$ECS_SERVICE_ARN" --region "$AWS_REGION" --query "service.currentDeployment" --output text)
          if [ -z "$deployment_arn" ] || [ "$deployment_arn" = "None" ]; then
            echo "No new deployment was created (image unchanged from the current one); nothing to wait for."
            exit 0
          fi
          echo "Watching deployment: $deployment_arn"
          for _ in $(seq 1 60); do
            state=$(aws ecs describe-service-deployments --service-deployment-arns "$deployment_arn" --region "$AWS_REGION" --query "serviceDeployments[0].status" --output text)
            echo "Deployment status: $state"
            if [ "$state" = "SUCCESSFUL" ]; then
              exit 0
            fi
            case "$state" in
              FAILED|ROLLBACK_SUCCESSFUL|ROLLBACK_FAILED|STOPPED)
                echo "Deployment did not succeed"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for deployment"
          exit 1
