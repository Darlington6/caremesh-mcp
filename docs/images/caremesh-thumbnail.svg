<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"
    aria-labelledby="title desc">
    <title id="title">Caremesh MCP - voice-first caregiving coordination</title>
    <desc id="desc">A dark blue and warm coral thumbnail featuring the Caremesh MCP name, caregiving coordination
        message, and Amazon Bedrock and Alexa Plus technology labels.</desc>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#101b31" />
            <stop offset="0.62" stop-color="#172d4c" />
            <stop offset="1" stop-color="#263d58" />
        </linearGradient>
        <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff8368" />
            <stop offset="1" stop-color="#e94d59" />
        </linearGradient>
        <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7fe0c2" />
            <stop offset="1" stop-color="#39b79e" />
        </linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#07101f" flood-opacity="0.42" />
        </filter>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0H0V48" fill="none" stroke="#d5e8ee" stroke-opacity="0.07" stroke-width="1" />
        </pattern>
    </defs>

    <rect width="1280" height="720" fill="url(#bg)" />
    <rect width="1280" height="720" fill="url(#grid)" />
    <circle cx="1120" cy="-28" r="270" fill="#f36d60" opacity="0.13" />
    <circle cx="1050" cy="648" r="210" fill="#67d5bd" opacity="0.1" />

    <g transform="translate(76 70)">
        <rect width="68" height="68" rx="18" fill="url(#coral)" />
        <path d="M20 37c9-17 18-17 27 0 9 17 18 17 27 0M20 49c9-17 18-17 27 0 9 17 18 17 27 0" fill="none"
            stroke="#fff9f3" stroke-width="6" stroke-linecap="round" />
        <text x="92" y="31" fill="#fff9f3" font-family="Georgia, serif" font-size="25" font-weight="700"
            letter-spacing="1">CAREmesh</text>
        <text x="94" y="56" fill="#b8cad6" font-family="Arial, sans-serif" font-size="14" letter-spacing="3">MCP
            SERVER</text>
    </g>

    <g transform="translate(76 188)">
        <text fill="#fff9f3" font-family="Georgia, serif" font-size="74" font-weight="700">Caregiving,</text>
        <text y="82" fill="#ff8068" font-family="Georgia, serif" font-size="74" font-weight="700">connected.</text>
        <text y="145" fill="#d1e0e3" font-family="Arial, sans-serif" font-size="25">A voice-first care coordination
            demo</text>
        <text y="183" fill="#d1e0e3" font-family="Arial, sans-serif" font-size="25">powered by MCP and Amazon
            Bedrock.</text>
    </g>

    <g transform="translate(78 570)">
        <rect width="184" height="48" rx="24" fill="#233c55" stroke="#6b8ba0" stroke-width="1" />
        <text x="92" y="31" text-anchor="middle" fill="#f7fbf6" font-family="Arial, sans-serif" font-size="17"
            font-weight="700">ALEXA+</text>
        <rect x="198" width="126" height="48" rx="24" fill="#233c55" stroke="#6b8ba0" stroke-width="1" />
        <text x="261" y="31" text-anchor="middle" fill="#f7fbf6" font-family="Arial, sans-serif" font-size="17"
            font-weight="700">MCP</text>
        <rect x="338" width="222" height="48" rx="24" fill="#233c55" stroke="#6b8ba0" stroke-width="1" />
        <text x="449" y="31" text-anchor="middle" fill="#f7fbf6" font-family="Arial, sans-serif" font-size="17"
            font-weight="700">AMAZON BEDROCK</text>
    </g>

    <g transform="translate(778 102)" filter="url(#shadow)">
        <rect width="410" height="516" rx="30" fill="#eef3f0" />
        <rect x="24" y="24" width="362" height="74" rx="16" fill="#17243b" />
        <circle cx="58" cy="61" r="12" fill="#67d5bd" />
        <text x="84" y="57" fill="#f5faf6" font-family="Arial, sans-serif" font-size="19"
            font-weight="700">caremesh-mcp</text>
        <text x="84" y="80" fill="#9fb5c1" font-family="Arial, sans-serif" font-size="13">CONNECTED • STREAMABLE
            HTTP</text>

        <rect x="24" y="122" width="362" height="104" rx="18" fill="#d8e8e2" />
        <circle cx="72" cy="174" r="26" fill="#ff7662" />
        <path d="M61 177c7-13 14-13 21 0 7 13 14 13 21 0" fill="none" stroke="#fff9f3" stroke-width="5"
            stroke-linecap="round" />
        <text x="117" y="166" fill="#182940" font-family="Arial, sans-serif" font-size="16"
            font-weight="700">Voice-first care</text>
        <text x="117" y="190" fill="#4d6974" font-family="Arial, sans-serif" font-size="14">Check-ins, medication,
            tasks</text>

        <rect x="24" y="250" width="362" height="104" rx="18" fill="#e7e9f4" />
        <circle cx="72" cy="302" r="26" fill="#4c6bdc" />
        <path d="M60 302h24M72 290v24" stroke="#fff" stroke-width="5" stroke-linecap="round" />
        <text x="117" y="294" fill="#182940" font-family="Arial, sans-serif" font-size="16" font-weight="700">MCP
            tools</text>
        <text x="117" y="318" fill="#4d6974" font-family="Arial, sans-serif" font-size="14">One shared care
            picture</text>

        <rect x="24" y="378" width="362" height="114" rx="18" fill="#173b4c" />
        <circle cx="72" cy="435" r="26" fill="url(#mint)" />
        <path d="M61 435h22M72 424v22" stroke="#113044" stroke-width="5" stroke-linecap="round" />
        <text x="117" y="426" fill="#f5faf6" font-family="Arial, sans-serif" font-size="16" font-weight="700">Amazon
            Bedrock</text>
        <text x="117" y="450" fill="#b6d8d1" font-family="Arial, sans-serif" font-size="14">Daily summaries and
            alerts</text>
    </g>

    <path d="M680 570h52" stroke="#ff8068" stroke-width="5" stroke-linecap="round" />
    <circle cx="654" cy="570" r="8" fill="#67d5bd" />
    <text x="76" y="677" fill="#8fa7b2" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">BUILD • SHIP •
        SHAPE | AMAZON DEVELOPER HACKATHON</text>
</svg>